<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Geetansh | Grid_Portfolio</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
  </head>
  <body>
    <div class="container">
      <nav class="nav">
        <div class="nav_links">
          <a href="#">Clients</a>
          <a href="#">Research</a>
          <a href="#">Portfolio</a>
          <a href="#">Podcast</a>
        </div>
      </nav>

      <header class="portfolio">
        <h1>Portfolio</h1>
        <i class="fa-sharp fa-solid fa-chevron-right"></i>
      </header>

      <main class="main_img">
        <div class="main-text">
          <i class="fa-solid fa-code"></i>
          <h2>About Me</h2>
        </div>
        <img src="./assets/images/hero_card.png" alt="Geetansh Sirohi" />
        <section class="hero-info">
          <p class="intro">Im,</p>
          <h1 class="hero-name">Geetansh<br />Sirohi</h1>
          <address class="hero-email">
            <a href="mailto:sirohigeetansh@gmail.com"
              >sirohigeetansh@gmail.com</a
            >
            <i class="fa-regular fa-envelope" aria-hidden="true"></i>
          </address>
        </section>
      </main>

      <section class="center">
        <img src="./assets/images/demo.png" alt="Featured project preview" />
        <a href="./assets/images/demo.gif">
          <div class="play-circle">
            <i class="fa-solid fa-play play"></i></div
        ></a>
        <i
          class="fa-sharp fa-solid fa-chevron-right chevron"
          aria-hidden="true"
        ></i>
      </section>

      <aside class="right" aria-label="Achievements">
        <div class="center-right1">
          <h3>251</h3>
          <p class="achievements_name">Projects</p>
          <i
            class="fa-sharp fa-solid fa-chevron-right chevron"
            aria-hidden="true"
          ></i>
        </div>
        <div class="center-right2">
          <h3>156</h3>
          <p class="achievements_name">Awards</p>
          <i
            class="fa-sharp fa-solid fa-chevron-right chevron"
            aria-hidden="true"
          ></i>
        </div>
      </aside>

      <section class="bottom_center" aria-label="Clients">
        <i class="fa-brands fa-apple apple_logo" aria-hidden="true"></i>
        <h3>Clients</h3>
        <i
          class="fa-sharp fa-solid fa-chevron-right chevron"
          aria-hidden="true"
        ></i>
      </section>

      <footer class="bottom_right">
        <figure class="bottom_right1">
          <img src="./assets/images/sphere.png" alt="3D decorative sphere" />
        </figure>
        <div class="bottom_right2">
          <h3>172</h3>
          <p>Global Design <span>Awards.</span></p>
          <i
            class="fa-sharp fa-solid fa-chevron-right chevron"
            aria-hidden="true"
          ></i>
        </div>
      </footer>
    </div>
  </body>
</html>
